<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mad Monkey Hostels — Network Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: #08090b; }
  html, body { overflow: hidden; }
  /* Embedded (?embed=1): fill whatever box the host iframe gives us instead of
     holding the 610/646 aspect, which would overflow a shorter frame and make
     it scroll. The SVG uses preserveAspectRatio="slice", so it crops rather
     than letterboxes. Standalone viewing is unaffected. */
  body.is-embed #map-wrap { max-width: none; width: 100vw; height: 100vh; aspect-ratio: auto; }
  #map-wrap {
    position: relative; width: 100%; max-width: 680px; margin: 0 auto;
    aspect-ratio: 610 / 646;
    background: #08090b; overflow: hidden;
  }
  #stipple { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pulse {
    fill: none; stroke: #ff01aa; stroke-width: 1.2;
    transform-box: fill-box; transform-origin: center;
    animation: mm-pulse 2.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }
  @keyframes mm-pulse {
    0%   { transform: scale(0.6); opacity: 0.85; }
    70%  { transform: scale(3.6); opacity: 0; }
    100% { transform: scale(3.6); opacity: 0; }
  }
  #tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    transform: translate(-50%, calc(-100% - 14px)) scale(0.96);
    background: #fff; color: #0a0a0a;
    font-family: "Montserrat", system-ui, sans-serif;
    padding: 12px 16px 11px; white-space: nowrap;
    box-shadow: 5px 5px 0 #ff01aa;
    transition: opacity 0.14s ease, transform 0.14s ease;
  }
  #tooltip.show { opacity: 1; transform: translate(-50%, calc(-100% - 14px)) scale(1); }
  #tooltip .name { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  #tooltip .country { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: #ff01aa; }
  #tooltip::after {
    content: ""; position: absolute; left: 50%; bottom: -6px;
    width: 12px; height: 12px; background: #fff;
    transform: translateX(-50%) rotate(45deg);
  }
  .country-label {
    fill: #fff; font-family: "Montserrat", system-ui, sans-serif;
    font-size: 15px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; paint-order: stroke; stroke: #08090b; stroke-width: 5px;
  }
  a { color: #ccff01; } a:hover { color: #ff01aa; }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; opacity: 0; }
  }
</style>
<script>
  if (new URLSearchParams(location.search).get("embed") === "1") {
    document.addEventListener("DOMContentLoaded", () => document.body.classList.add("is-embed"));
  }
</script>
</head>
<body>
<div id="map-wrap">
  <canvas id="stipple"></canvas>
  <svg id="overlay" viewBox="0 0 610 646" preserveAspectRatio="xMidYMid slice" aria-label="Map of Mad Monkey Hostels locations across Southeast Asia">
    <defs>
      <filter id="pinGlow" x="-300%" y="-300%" width="700%" height="700%">
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
      <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
    </defs>
    <g id="routes"></g>
    <g id="labels"></g>
    <g id="pins"></g>
    <g id="hits"></g>
  </svg>
  <div id="tooltip"></div>
</div>
<script>
/* ============ CONFIG — adjust framing here ============ */
let CONFIG = {
  center: [111.5, 6.5],  // [lon, lat] the view is centred on
  zoom: 1.0,             // 1 = fit the whole region; >1 zooms in
  bounds: [[92, -10], [131, 23]] // region extent used to compute the base fit
};
/* ====================================================== */

/* Embedded, the host iframe decides the box. Draw at that aspect rather than
   at the standalone 610x646: "slice" would otherwise crop away a third of the
   framing we picked, and — worse — the stipple canvas stretches to its box
   where the SVG crops, so the coastline drifts out of register with the pins
   sitting on top of it. Matching the aspect makes the two agree. */
let W = 610, H = 646;
if (new URLSearchParams(location.search).get("embed") === "1") {
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  if (vw > 0 && vh > 0) H = Math.round(W * vh / vw);
}
document.getElementById("overlay").setAttribute("viewBox", "0 0 " + W + " " + H);

const PINK = "#ff01aa", LIME = "#ccff01";

const LOCATIONS = [
  ["Phnom Penh", "Cambodia", 11.5564, 104.9282],
  ["Siem Reap", "Cambodia", 13.3671, 103.8448],
  ["Koh Rong", "Cambodia", 10.7167, 103.2500],
  ["Koh Sdach", "Cambodia", 11.2333, 102.9667],
  ["Manila", "Philippines", 14.5995, 120.9842],
  ["Nacpan Beach", "Philippines", 11.3167, 119.4167],
  ["Siargao", "Philippines", 9.8482, 126.0458],
  ["Panglao", "Philippines", 9.5787, 123.7500],
  ["Dumaguete", "Philippines", 9.3068, 123.3054],
  ["Siquijor", "Philippines", 9.1994, 123.5950],
  ["Bangkok", "Thailand", 13.7563, 100.5018],
  ["Chiang Mai", "Thailand", 18.7883, 98.9853],
  ["Pai", "Thailand", 19.3583, 98.4364],
  ["Phuket", "Thailand", 7.8804, 98.3923],
  ["Uluwatu", "Indonesia", -8.8290, 115.0850],
  ["Nusa Lembongan", "Indonesia", -8.6800, 115.4500],
  ["Gili Trawangan", "Indonesia", -8.3500, 116.0333],
  ["Kuta Lombok", "Indonesia", -8.8833, 116.2833],
  ["Luang Prabang", "Laos", 19.8834, 102.1347],
  ["Vang Vieng", "Laos", 18.9236, 102.4479],
  ["Hanoi", "Vietnam", 21.0278, 105.8342],
  ["Hoi An", "Vietnam", 15.8801, 108.3380]
];

const TRAIL = [
  ["Uluwatu", "Nusa Lembongan"], ["Nusa Lembongan", "Gili Trawangan"], ["Gili Trawangan", "Kuta Lombok"],
  ["Uluwatu", "Siargao"], ["Siargao", "Panglao"], ["Panglao", "Dumaguete"], ["Dumaguete", "Siquijor"],
  ["Siquijor", "Manila"], ["Manila", "Nacpan Beach"], ["Nacpan Beach", "Phuket"],
  ["Phuket", "Bangkok"], ["Bangkok", "Chiang Mai"], ["Chiang Mai", "Pai"], ["Pai", "Luang Prabang"],
  ["Luang Prabang", "Vang Vieng"], ["Vang Vieng", "Hanoi"], ["Hanoi", "Hoi An"],
  ["Hoi An", "Phnom Penh"], ["Phnom Penh", "Siem Reap"],
  ["Phnom Penh", "Koh Rong"], ["Koh Rong", "Koh Sdach"]
];

/* ---- Per-trip filtering (added for the ALL IN preview) ------------------
   Load with ?trip=<slug> to draw only that trip's stops and the route between
   them. With no parameter the full network map renders exactly as before.

   Stops not in Dhany's hostel list are trip stops rather than properties, so
   they are added here rather than to LOCATIONS above. ------------------- */
const TRIP_EXTRA_STOPS = [
  ["Ha Giang", "Vietnam", 22.8233, 104.9784],
  ["Lan Ha Bay", "Vietnam", 20.7500, 107.0700],
  ["Ninh Binh", "Vietnam", 20.2506, 105.9745],
  ["Sihanoukville", "Cambodia", 10.6270, 103.5220]
];

/* Ordered route per trip, taken stop-for-stop off the itinerary in
   src/data/preview-*.ts. Repeats are deliberate — these trips return to a hub
   between legs, and the map should show that rather than a tidy fiction.
   Names must match LOCATIONS / TRIP_EXTRA_STOPS. */
const TRIP_ROUTES = {
  "indonesia":   ["Uluwatu", "Nusa Lembongan", "Gili Trawangan", "Kuta Lombok"],
  "indonesia-7": ["Gili Trawangan", "Kuta Lombok"],
  "vietnam":     ["Hanoi", "Lan Ha Bay", "Hanoi", "Ha Giang", "Hanoi", "Ninh Binh", "Hoi An"],
  "vietnam-7":   ["Hanoi", "Ha Giang", "Hanoi"],
  "cambodia":    ["Phnom Penh", "Siem Reap", "Sihanoukville", "Koh Rong", "Koh Sdach", "Phnom Penh"]
};

/* Framing per trip. Auto-fitting to the stops alone crops to a featureless
   patch of coast — the point of the map is that you recognise the country, so
   each trip gets a hand-set extent wide enough to read the landmass, plus the
   labels that belong inside it. */
const TRIP_VIEWS = {
  "indonesia":   { country: "Indonesia", bounds: [[114.3, -9.3], [117.1, -8.0]],
                   labels: [["Bali", 115.15, -8.75], ["Lombok", 116.45, -8.45]] },
  "indonesia-7": { country: "Indonesia", bounds: [[115.4, -9.3], [117.1, -8.0]],
                   labels: [["Lombok", 116.45, -8.45]] },
  "vietnam":     { country: "Vietnam", bounds: [[101.4, 14.4], [111.2, 23.7]],
                   labels: [["Vietnam", 106.3, 18.3]] },
  "vietnam-7":   { country: "Vietnam", bounds: [[101.6, 18.6], [109.6, 23.8]],
                   labels: [["Vietnam", 105.4, 19.5]] },
  "cambodia":    { country: "Cambodia", bounds: [[101.8, 9.4], [108.1, 15.1]],
                   labels: [["Cambodia", 105.9, 13.3]] }
};

const TRIP_SLUG = new URLSearchParams(location.search).get("trip");
const TRIP_STOPS = TRIP_SLUG ? TRIP_ROUTES[TRIP_SLUG] : null;
const TRIP_VIEW = TRIP_SLUG ? TRIP_VIEWS[TRIP_SLUG] : null;

if (TRIP_STOPS) {
  const all = LOCATIONS.concat(TRIP_EXTRA_STOPS);
  const unique = TRIP_STOPS.filter((n, i) => TRIP_STOPS.indexOf(n) === i);
  const picked = unique
    .map(n => all.find(l => l[0] === n))
    .filter(Boolean);

  LOCATIONS.length = 0;
  picked.forEach(l => LOCATIONS.push(l));

  TRAIL.length = 0;
  for (let i = 0; i < TRIP_STOPS.length - 1; i++) {
    if (TRIP_STOPS[i] !== TRIP_STOPS[i + 1]) TRAIL.push([TRIP_STOPS[i], TRIP_STOPS[i + 1]]);
  }

  if (TRIP_VIEW) {
    CONFIG.bounds = TRIP_VIEW.bounds;
  } else {
    // No hand-set extent for this slug: fall back to fitting the stops, with a
    // floor so a two-stop route still gets some land around it.
    const lats = picked.map(l => l[2]), lons = picked.map(l => l[3]);
    const padLat = Math.max(0.9, (Math.max(...lats) - Math.min(...lats)) * 0.35);
    const padLon = Math.max(0.9, (Math.max(...lons) - Math.min(...lons)) * 0.35);
    CONFIG.bounds = [
      [Math.min(...lons) - padLon, Math.min(...lats) - padLat],
      [Math.max(...lons) + padLon, Math.max(...lats) + padLat]
    ];
  }
  const [[bw, bs], [be, bn]] = CONFIG.bounds;
  CONFIG.center = [(bw + be) / 2, (bs + bn) / 2];
  CONFIG.zoom = 1.0;
}

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

const TOPOLOGY = TRIP_STOPS
  ? "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json"   // country-level zoom needs the detail
  : "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json"; // whole-region view does not

d3.json(TOPOLOGY).then(topology => {
  const land = topojson.feature(topology, topology.objects.countries);

  // Projection: fit network bounds, then apply zoom + centre nudge
  const [[w0, s0], [e0, n0]] = CONFIG.bounds;
  const bboxGeo = { type: "MultiPoint", coordinates: [[w0, s0], [e0, s0], [e0, n0], [w0, n0]] };
  const proj = d3.geoMercator().fitExtent([[14, 14], [W - 14, H - 14]], bboxGeo);
  proj.scale(proj.scale() * CONFIG.zoom);
  const c = proj(CONFIG.center);
  proj.translate([proj.translate()[0] + (W / 2 - c[0]), proj.translate()[1] + (H / 2 - c[1])]);

  // Mainland SE Asia is one continuous stipple, so a country only reads as
  // itself if we pick it out of its neighbours.
  const focus = TRIP_VIEW && TRIP_VIEW.country
    ? { type: "FeatureCollection",
        features: land.features.filter(f => f.properties && f.properties.name === TRIP_VIEW.country) }
    : null;

  drawStipple(land, focus, proj);
  drawCountryLabels(proj);
  const pts = {};
  LOCATIONS.forEach(([name, country, lat, lon]) => { pts[name] = { name, country, xy: proj([lon, lat]) }; });
  drawRoutesAndPins(pts);
});

/* ---- country labels ---- */
function drawCountryLabels(proj) {
  const g = document.getElementById("labels");
  const NETWORK_LABELS = [
    ["Laos", 102.6, 21.6, "middle"], ["Vietnam", 107.6, 16.3, "middle"],
    ["Thailand", 96.5, 14.2, "middle"], ["Cambodia", 105.9, 11.9, "middle"],
    ["Philippines", 125.6, 13.6, "middle"], ["Indonesia", 113.6, -7.0, "middle"]
  ];
  // A trip view is framed on one country, so it carries its own label set —
  // the network positions are placed for the whole-region fit and land in the
  // wrong part of the map (or off it) once we zoom in.
  const labels = TRIP_VIEW
    ? TRIP_VIEW.labels.map(([name, lon, lat]) => [name, lon, lat, "middle"])
    : NETWORK_LABELS;
  labels
  .forEach(([name, lon, lat, anchor]) => {
    const [x, y] = proj([lon, lat]);
    const t = el("text", { x: x.toFixed(1), y: y.toFixed(1), "text-anchor": anchor, class: "country-label" }, g);
    t.textContent = name;
  });
}

/* ---- grey dot-matrix land ---- */
function drawStipple(land, focus, proj) {
  const rasterise = (geo) => {
    const mask = document.createElement("canvas");
    mask.width = W; mask.height = H;
    const mctx = mask.getContext("2d", { willReadFrequently: true });
    const path = d3.geoPath(proj, mctx);
    mctx.fillStyle = "#fff";
    mctx.beginPath(); path(geo); mctx.fill();
    return mctx.getImageData(0, 0, W, H).data;
  };
  const landPx = rasterise(land);
  const focusPx = focus ? rasterise(focus) : null;

  const cv = document.getElementById("stipple");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const s = 10, rowH = s * 0.866, r = 2;
  // Neighbours stay as context; the trip's country carries the shape.
  const LAND = focusPx ? "rgba(156, 163, 175, 0.14)" : "rgba(156, 163, 175, 0.5)";
  const FOCUS = "rgba(156, 163, 175, 0.5)";
  for (const [fill, hit] of [[LAND, (i) => landPx[i] > 0 && !(focusPx && focusPx[i] > 0)],
                             [FOCUS, (i) => !!focusPx && focusPx[i] > 0]]) {
    ctx.fillStyle = fill;
    for (let row = 0, y = 2; y < H; row++, y += rowH) {
      const off = (row % 2) * (s / 2);
      for (let x = off; x < W; x += s) {
        const i = (Math.round(y) * W + Math.round(x)) * 4 + 3;
        if (hit(i)) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      }
    }
  }
}

/* ---- pins, arcs, animation ---- */
function drawRoutesAndPins(pts) {
  const routesG = document.getElementById("routes");
  const pinsG = document.getElementById("pins");
  const hitsG = document.getElementById("hits");
  const tooltip = document.getElementById("tooltip");
  const wrap = document.getElementById("map-wrap");
  const svg = document.getElementById("overlay");

  // Arcs: quadratic curve, bow scales with distance
  const arcs = TRAIL.map(([a, b]) => {
    const [x1, y1] = pts[a].xy, [x2, y2] = pts[b].xy;
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    const bow = Math.min(dist * 0.22, 70);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    // Network view: bow upward regardless of which way the leg runs.
    // Trip view: bow to the left of travel instead, so an out-and-back leg
    // (Hanoi -> Ha Giang -> Hanoi) draws two visible arcs rather than the
    // return journey retracing a line that is already on screen.
    const nx = -dy / dist, ny = dx / dist; // perpendicular
    const cx = TRIP_STOPS ? mx + (dy / dist) * bow : mx + nx * bow * (ny < 0 ? -1 : 1) * -1;
    const cy = TRIP_STOPS ? my - (dx / dist) * bow : my + ny * bow * (ny < 0 ? -1 : 1) * -1;
    const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    const p = el("path", { d, fill: "none", stroke: LIME, "stroke-width": 1.6, "stroke-linecap": "round", opacity: 0.85 }, routesG);
    const len = p.getTotalLength();
    p.setAttribute("stroke-dasharray", len);
    p.setAttribute("stroke-dashoffset", len);
    const dotGlow = el("circle", { r: 4.5, fill: LIME, filter: "url(#dotGlow)", opacity: 0 }, routesG);
    const dot = el("circle", { r: 2.2, fill: LIME, opacity: 0 }, routesG);
    return { p, len, dot, dotGlow };
  });

  // Pins
  Object.values(pts).forEach(({ name, country, xy: [x, y] }, i) => {
    el("circle", { cx: x, cy: y, r: 5.5, fill: PINK, opacity: 0.35, filter: "url(#pinGlow)" }, pinsG);
    const ring = el("circle", { cx: x, cy: y, r: 4.5, class: "pulse" }, pinsG);
    ring.style.animationDelay = (i * 0.21) % 2.6 + "s";
    el("circle", { cx: x, cy: y, r: 4.2, fill: PINK }, pinsG);
    const hit = el("circle", { cx: x, cy: y, r: 13, fill: "transparent", cursor: "pointer" }, hitsG);
    hit.addEventListener("pointerenter", () => {
      // svg uses slice; map viewBox coords -> wrap px
      const rect = wrap.getBoundingClientRect();
      const scale = Math.max(rect.width / W, rect.height / H);
      const ox = (rect.width - W * scale) / 2, oy = (rect.height - H * scale) / 2;
      tooltip.innerHTML = '<span class="name">' + name + '</span><span class="country">' + country + "</span>";
      tooltip.style.left = (x * scale + ox) + "px";
      tooltip.style.top = (y * scale + oy) + "px";
      tooltip.classList.add("show");
    });
    hit.addEventListener("pointerleave", () => { tooltip.classList.remove("show"); });
  });

  if (reduceMotion) {
    arcs.forEach(a => a.p.setAttribute("stroke-dashoffset", 0));
    return;
  }

  // Timeline: draw, hold, loop.
  // Trip view runs one leg at a time — a leg only starts once the travelling
  // dot on the leg before it has landed on its stop, so the line reads as the
  // itinerary in order. The full network map keeps its overlapping stagger;
  // with 21 legs, running them end to end would take most of a minute.
  const STAGGER = 0.15, HOLD = 2.4;
  let t0 = null;
  const durs = arcs.map(a => 0.35 + a.len / 380);
  const starts = [];
  if (TRIP_STOPS) durs.reduce((acc, d, i) => { starts[i] = acc; return acc + d; }, 0);
  else arcs.forEach((a, i) => { starts[i] = i * STAGGER; });
  const drawEnd = Math.max(...starts.map((s, i) => s + durs[i]));
  const period = drawEnd + HOLD;
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function frame(now) {
    if (t0 === null) t0 = now;
    const t = ((now - t0) / 1000) % period;
    arcs.forEach((a, i) => {
      const p = Math.min(Math.max((t - starts[i]) / durs[i], 0), 1);
      const e = ease(p);
      a.p.setAttribute("stroke-dashoffset", a.len * (1 - e));
      const active = p > 0 && p < 1;
      a.dot.setAttribute("opacity", active ? 1 : 0);
      a.dotGlow.setAttribute("opacity", active ? 0.7 : 0);
      if (active) {
        const pt = a.p.getPointAtLength(a.len * e);
        a.dot.setAttribute("cx", pt.x); a.dot.setAttribute("cy", pt.y);
        a.dotGlow.setAttribute("cx", pt.x); a.dotGlow.setAttribute("cy", pt.y);
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
